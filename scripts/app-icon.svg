<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#3A7BFF"/>
      <stop offset="1" stop-color="#14C8E8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1A0B5C" flood-opacity="0.35"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- make-icon.mjs drops lines marked mac-only for the full-bleed variant -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#outer)"/><!-- mac-only -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#body)">
    <g filter="url(#blur)">
      <circle cx="260" cy="760" r="230" fill="#FF5FA8" opacity="0.75"/>
      <circle cx="800" cy="220" r="200" fill="#7DF9FF" opacity="0.6"/>
    </g>
  </g>
  <g filter="url(#drop)">
    <rect x="232" y="252" width="264" height="520" rx="64" fill="url(#glass)"/>
    <rect x="528" y="252" width="264" height="520" rx="64" fill="url(#glass)"/>
  </g>
  <g fill="none" stroke="url(#rim)" stroke-width="5">
    <rect x="234.5" y="254.5" width="259" height="515" rx="62"/>
    <rect x="530.5" y="254.5" width="259" height="515" rx="62"/>
  </g>
  <rect x="270" y="340" width="188" height="44" rx="22" fill="#FFFFFF"/>
</svg>
