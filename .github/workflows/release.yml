name: Release

# Push a tag like v0.2.0 to build installers for macOS (.dmg, universal),
# Windows (.msi + NSIS .exe) and Linux (.deb, AppImage, Arch PKGBUILD) and
# attach them to a draft GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
          # Ubuntu 22.04: the AppImage then runs on older distributions too.
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing (set these secrets to sign / notarize):
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dualion ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # Arch Linux: a PKGBUILD that installs the .deb of this release.
      - name: Arch Linux PKGBUILD
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          ver="${GITHUB_REF_NAME#v}"
          sed -e "s/@VERSION@/$ver/" -e "s/@SHA256@/$(sha256sum "$deb" | cut -d' ' -f1)/" -e "s/@DEB@/$(basename "$deb")/" packaging/arch/PKGBUILD.in > PKGBUILD
          gh api --method POST -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=PKGBUILD" \
            --input PKGBUILD
