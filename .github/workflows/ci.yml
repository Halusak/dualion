name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: echo "::add-matcher::.github/rust-matcher.json"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      # Linux packages are built on other branches too, to catch packaging problems early.
      - name: Linux packages (deb, AppImage)
        if: runner.os == 'Linux' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -o pipefail
          npm run tauri build -- --bundles deb,appimage 2>&1 | tee bundle.log || {
            echo "::error title=Linux bundle failed::$(tail -n 60 bundle.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
          ls -la src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/appimage
